name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-impayes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops-impayes/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install ruff
      - run: ruff check src tests flows

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-impayes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops-impayes/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q --maxfail=1

  train:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-impayes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops-impayes/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: Données (DVC, sinon téléchargement direct)
        run: dvc pull || python -m src.data

      - name: Entraînement
        run: python -m src.train
        env:
          MLFLOW_TRACKING_URI: "${{ secrets.MLFLOW_TRACKING_URI }}"

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: mlops-impayes/models/

  validate:
    needs: train
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-impayes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: mlops-impayes/models/

      - name: Gate de validation (F1 et AUC)
        run: |
          python - <<'PY'
          import json, sys, yaml
          m = json.load(open("models/metrics.json"))
          g = yaml.safe_load(open("params.yaml"))["gate"]
          print(m, g)
          sys.exit(0 if m["f1"] >= g["min_f1"] and m["auc"] >= g["min_auc"] else 1)
          PY

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: mlops-impayes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: mlops-impayes/models/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - run: docker build -t $IMAGE:${{ github.sha }} .

      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: CRITICAL
          exit-code: "1"

      - run: docker push $IMAGE:${{ github.sha }}

  deploy:
    needs: build
    if: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déploiement sur le serveur (approbation manuelle requise)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
            docker rm -f default-risk-api || true
            docker run -d --name default-risk-api -p 8000:8000 \
              ghcr.io/${{ github.repository }}:${{ github.sha }}
            sleep 5 && curl -f http://localhost:8000/health
